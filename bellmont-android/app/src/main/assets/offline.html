<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Bellmont Express</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #fff; color: #1d2b59;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .badge { width: 72px; height: 56px; margin: 0 auto 20px; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 auto 24px; max-width: 280px; color: #5b6685; }
  button { border: 0; border-radius: 10px; padding: 13px 28px; background: #1d2b59; color: #fff; font: 600 15px system-ui, sans-serif; }
</style>
</head>
<body>
  <main>
    <svg class="badge" viewBox="0 0 128 100" aria-hidden="true">
      <g transform="translate(10.6 0) skewX(-12)">
        <rect x="16" y="8" width="96" height="84" rx="22" fill="#f6a23a"/>
        <path d="M50 28V72M50 28H64C71 28 75 32 75 38.5C75 45 71 49 64 49H50M50 49H67C74.5 49 79 53.5 79 60.5C79 67.5 74.5 72 67 72H50"
          fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>Bellmont Express needs an internet connection. Check your connection and try again.</p>
    <button type="button" onclick="window.BXApp ? BXApp.retry() : location.reload()">Try again</button>
  </main>
</body>
</html>
