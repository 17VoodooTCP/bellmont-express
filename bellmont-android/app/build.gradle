plugins {
    id "com.android.application"
}

/*
 * Release signing material lives outside the repository and outside OneDrive:
 * ~/bellmont-signing/keystore.properties (or the path in BELLMONT_KEYSTORE_PROPS)
 * with storeFile, storePassword, keyAlias and keyPassword. Without it the
 * release build is left unsigned rather than failing.
 */
def keystorePropsFile = file(System.getenv("BELLMONT_KEYSTORE_PROPS")
        ?: "${System.getProperty('user.home')}/bellmont-signing/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.bellmontexpress.app"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35

        /* The app is the live site, so every deploy reaches it without a new
           APK. Hosts in APP_HOSTS stay inside the app; anything else opens in
           the phone's browser. */
        buildConfigField "String", "APP_HOSTS",
                "\"bellmont-express.vercel.app,bellmontexpress.com,www.bellmontexpress.com\""
    }

    /*
     * Two apps from one codebase. They differ only in where they open, their
     * name and their icon; separate application ids let both sit on one phone.
     * The customer app has no route into the admin console — the public site
     * never links to it and the app has no address bar — so the admin console
     * ships only in the admin app, which is handed to staff.
     */
    flavorDimensions "audience"
    productFlavors {
        customer {
            dimension "audience"
            applicationId "com.bellmontexpress.app"
            versionCode 2
            versionName "1.0.1"
            resValue "string", "app_name", "Bellmont Express"
            buildConfigField "String", "START_URL", "\"https://bellmont-express.vercel.app/\""
        }
        admin {
            dimension "audience"
            applicationId "com.bellmontexpress.admin"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "Bellmont Admin"
            buildConfigField "String", "START_URL", "\"https://bellmont-express.vercel.app/admin/login\""
        }
    }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"]) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Document-start script injection, used to route window.print() to Android.
    implementation "androidx.webkit:webkit:1.12.1"
}
