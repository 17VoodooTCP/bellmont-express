# Production Blueprint for the Bellmont Express monorepo.
# Neon is the production database. MongoDB Atlas remains an external,
# one-time migration source and is not provisioned by Render.
services:
  - type: web
    name: meridian-core
    env: node
    plan: free
    rootDir: meridian-core
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
