services:
  - type: web
    name: meridian-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed browser origins (your Vercel URL and any
      # custom domains). Set in the Render dashboard after the frontend deploys.
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: 5000
